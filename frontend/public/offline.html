<!DOCTYPE html>
<html lang="sw">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#0d9488" />
    <title>Smart Crops — Offline</title>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      body {
        font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        background: #0f172a;
        color: #f1f5f9;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        padding: 24px;
        text-align: center;
      }
      .icon {
        width: 80px;
        height: 80px;
        border-radius: 20px;
        background: rgba(13, 148, 136, 0.15);
        display: flex;
        align-items: center;
        justify-content: center;
        margin-bottom: 24px;
      }
      .icon svg { width: 40px; height: 40px; }
      h1 {
        font-size: 22px;
        font-weight: 700;
        margin-bottom: 8px;
        color: #0d9488;
      }
      p {
        font-size: 15px;
        color: #94a3b8;
        max-width: 360px;
        line-height: 1.6;
        margin-bottom: 8px;
      }
      .swahili {
        font-size: 13px;
        color: #64748b;
        font-style: italic;
      }
      .retry-btn {
        margin-top: 28px;
        padding: 12px 32px;
        background: #0d9488;
        color: #fff;
        border: none;
        border-radius: 12px;
        font-size: 15px;
        font-weight: 600;
        cursor: pointer;
        transition: background 0.2s, transform 0.1s;
        min-height: 48px;
        min-width: 48px;
      }
      .retry-btn:hover { background: #0f766e; }
      .retry-btn:active { transform: scale(0.97); }
      .status {
        margin-top: 16px;
        font-size: 12px;
        color: #64748b;
      }
      .status .dot {
        display: inline-block;
        width: 8px;
        height: 8px;
        border-radius: 50%;
        margin-right: 6px;
        vertical-align: middle;
      }
      .dot.offline { background: #ef4444; }
      .dot.online { background: #22c55e; }
      .cached-info {
        margin-top: 20px;
        padding: 12px 20px;
        background: rgba(255,255,255,0.05);
        border-radius: 12px;
        font-size: 13px;
        color: #94a3b8;
        max-width: 360px;
      }
      .cached-info strong { color: #f1f5f9; }
    </style>
  </head>
  <body>
    <div class="icon">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="#0d9488" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <line x1="1" y1="1" x2="23" y2="23"></line>
        <path d="M16.72 11.06A10.94 10.94 0 0 1 19 12.55"></path>
        <path d="M5 12.55a10.94 10.94 0 0 1 5.17-2.39"></path>
        <path d="M10.71 5.05A16 16 0 0 1 22.56 9"></path>
        <path d="M1.42 9a15.91 15.91 0 0 1 4.7-2.88"></path>
        <path d="M8.53 16.11a6 6 0 0 1 6.95 0"></path>
        <line x1="12" y1="20" x2="12.01" y2="20"></line>
      </svg>
    </div>
    <h1>You're Offline</h1>
    <p>No internet connection detected. Some features are unavailable, but your last cached data is still accessible.</p>
    <p class="swahili">Hakuna mtandao. Data yako ya mwisho bado inapatikana.</p>

    <div class="cached-info" id="cachedInfo" style="display:none;">
      Last updated: <strong id="lastUpdated">—</strong>
    </div>

    <button class="retry-btn" onclick="retryConnection()">
      Try Again / Jaribu Tena
    </button>

    <div class="status" id="status">
      <span class="dot offline" id="statusDot"></span>
      <span id="statusText">No connection</span>
    </div>

    <script>
      function retryConnection() {
        if (navigator.onLine) {
          window.location.href = '/';
        } else {
          document.getElementById('statusText').textContent = 'Still offline — checking...';
          // Check again after a moment
          setTimeout(function() {
            if (navigator.onLine) {
              window.location.href = '/';
            } else {
              document.getElementById('statusText').textContent = 'Still no connection';
            }
          }, 2000);
        }
      }

      // Show cached data timestamp if available
      try {
        var ts = localStorage.getItem('smart-crops-last-sync');
        if (ts) {
          var date = new Date(ts);
          document.getElementById('lastUpdated').textContent = date.toLocaleString('en-TZ', {
            dateStyle: 'medium', timeStyle: 'short'
          });
          document.getElementById('cachedInfo').style.display = 'block';
        }
      } catch(e) {}

      // Listen for connectivity changes
      window.addEventListener('online', function() {
        document.getElementById('statusDot').className = 'dot online';
        document.getElementById('statusText').textContent = 'Back online — redirecting...';
        setTimeout(function() { window.location.href = '/'; }, 1500);
      });

      window.addEventListener('offline', function() {
        document.getElementById('statusDot').className = 'dot offline';
        document.getElementById('statusText').textContent = 'No connection';
      });
    </script>
  </body>
</html>
