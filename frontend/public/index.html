<!DOCTYPE html>
<html lang="sw">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" href="%PUBLIC_URL%/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=5, viewport-fit=cover" />
    <meta name="theme-color" content="#0d9488" />
    <meta
      name="description"
      content="Smart Crops — Real-time crop price tracking, market analytics, and price forecasting for farmers, traders, and agents across Tanzania."
    />

    <!-- PWA / Installability -->
    <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="application-name" content="SmartCrops" />

    <!-- Apple PWA -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="SmartCrops" />
    <link rel="apple-touch-icon" href="%PUBLIC_URL%/logo192.png" />
    <link rel="apple-touch-icon" sizes="512x512" href="%PUBLIC_URL%/logo512.png" />

    <!-- Open Graph -->
    <meta property="og:title" content="Smart Crops - Market Price Tracker" />
    <meta property="og:description" content="Track crop prices, analyze market trends, and get price forecasts for smarter agricultural trading." />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="%PUBLIC_URL%/logo512.png" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Smart Crops - Market Price Tracker" />
    <meta name="twitter:description" content="Track crop prices, analyze market trends, and get price forecasts for smarter agricultural trading." />
    <meta name="twitter:image" content="%PUBLIC_URL%/logo512.png" />

    <!-- Fonts (async load) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" media="print" onload="this.media='all'" />
    <noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" /></noscript>

    <!-- Theme init (prevent FOUC) -->
    <script>
      (function(){var t=localStorage.getItem('smart-crops-theme');if(t)document.documentElement.setAttribute('data-theme',t)})();
    </script>
    <!-- Google Sign-In SDK -->
    <script src="https://accounts.google.com/gsi/client" async defer></script>
    <title>Smart Crops - Market Price Tracker</title>
  </head>
  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>
  </body>
</html>
